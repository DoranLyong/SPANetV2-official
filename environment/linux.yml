name: spanetv2
channels:
  - conda-forge
dependencies:
  # Python 3.11 for RTX 5090 + CUDA 12.8 + PyTorch 2.7.0
  - python=3.11
  
  # Build tools (needed for pytorch3d compilation)
  - c-compiler
  - cxx-compiler
  - gcc
  - gxx
  
  # Essential system libraries
  - ca-certificates
  - openssl
  - libffi
  - ncurses
  - readline
  - tk
  - zlib
  - bzip2
  - xz
  - libsqlite
  
  # Python package management
  - pip
  - setuptools
  - wheel
  - pyyaml
  
  # Graphics/GUI dependencies (for visualization)
  - cairo
  - fontconfig
  - freetype
  - harfbuzz
  - libpng
  - libjpeg-turbo
  - qt-main

  # Video encoding (for matplotlib animation)
  - ffmpeg
  
  # X11 libraries (for display)
  - xorg-libx11
  - xorg-libxext
  - xorg-libxrender
  - libxcb
  
  # CUDA toolkit (matched to torch 2.8.0+cu128 — provides nvcc + headers
  # for source builds like pytorch3d, so we don't depend on system /usr/local/cuda)
  - nvidia::cuda-toolkit=12.8.*

  # NOTE: PyTorch is installed via pip (see requirements.txt).
  # The CUDA toolkit above provides nvcc/headers for compiling CUDA
  # extensions inside the env.